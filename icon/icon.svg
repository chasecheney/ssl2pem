<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- macOS icon grid: 824x824 squircle centered, with the rest as transparent margin -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FE4"/>
      <stop offset="1" stop-color="#173C8F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD866"/>
      <stop offset="0.55" stop-color="#F2B01E"/>
      <stop offset="1" stop-color="#C77D06"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#E29A10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircleClip">
      <rect id="squircle" x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <g filter="url(#shadow)">
    <use href="#squircle" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircleClip)">
    <!-- subtle diagonal sheen -->
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <!-- faint grid of "certificate text" lines in the background for texture -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="10" stroke-linecap="round">
      <line x1="170" y1="220" x2="420" y2="220"/>
      <line x1="170" y1="270" x2="330" y2="270"/>
      <line x1="600" y1="780" x2="860" y2="780"/>
      <line x1="690" y1="830" x2="860" y2="830"/>
    </g>
  </g>

  <!-- Certificate sheet -->
  <g filter="url(#softShadow)">
    <path d="M292 232 h330 l110 110 v410 a26 26 0 0 1 -26 26 h-414 a26 26 0 0 1 -26 -26 v-494 a26 26 0 0 1 26 -26 z" fill="url(#paper)"/>
    <!-- folded corner -->
    <path d="M622 232 v84 a26 26 0 0 0 26 26 h84 z" fill="#C9D4E8"/>
  </g>

  <!-- PEM header / body lines -->
  <g stroke="#3A5C9E" stroke-linecap="round" fill="none">
    <line x1="332" y1="330" x2="560" y2="330" stroke-width="20" stroke-opacity="0.9"/>
    <g stroke-width="14" stroke-opacity="0.35">
      <line x1="332" y1="392" x2="640" y2="392"/>
      <line x1="332" y1="438" x2="640" y2="438"/>
      <line x1="332" y1="484" x2="590" y2="484"/>
      <line x1="332" y1="530" x2="640" y2="530"/>
      <line x1="332" y1="576" x2="470" y2="576"/>
    </g>
  </g>

  <!-- Ribbon seal (bottom-right of the sheet) -->
  <g transform="translate(622 626)">
    <path d="M-30 20 l-40 118 l52 -22 l30 44 l30 -140 z" fill="#D03B3B"/>
    <path d="M30 20 l40 118 l-52 -22 l-30 44 l-30 -140 z" fill="#B42E2E"/>
    <circle r="66" fill="url(#gold)"/>
    <circle r="66" fill="none" stroke="url(#goldEdge)" stroke-width="6"/>
    <circle r="44" fill="none" stroke="#B87A0C" stroke-opacity="0.55" stroke-width="5" stroke-dasharray="6 9"/>
    <!-- check mark -->
    <path d="M-24 2 l16 16 l34 -36" fill="none" stroke="#7A4E05" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Key, lying diagonally across the lower-left -->
  <g transform="translate(238 748) rotate(-30)" filter="url(#softShadow)">
    <!-- bow (ring) -->
    <circle cx="0" cy="0" r="76" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#goldEdge)" stroke-width="8"/>
    <circle cx="0" cy="0" r="34" fill="#1B3F8E"/>
    <!-- shaft -->
    <rect x="70" y="-24" width="250" height="48" rx="16" fill="url(#gold)"/>
    <rect x="70" y="-24" width="250" height="48" rx="16" fill="none" stroke="url(#goldEdge)" stroke-width="6"/>
    <!-- bits -->
    <rect x="226" y="-70" width="32" height="56" rx="8" fill="url(#gold)"/>
    <rect x="278" y="-84" width="32" height="70" rx="8" fill="url(#gold)"/>
    <!-- highlight along the top edge -->
    <rect x="86" y="-18" width="214" height="8" rx="4" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
